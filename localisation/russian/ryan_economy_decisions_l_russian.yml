l_russian:
 ryan_economy_decisions:0 "Управление экономикой"
 ryan_economy_decisions_desc:0 "Улучшение экономики, науки и промышленного производства вашей страны. Это включает в себя инвестиции в гражданские и военные университеты, транспорт, сельхозугодья, горную промышленность, промышленность. Новые места для городов и поселков разрабатываются с помощью агрессивной иммиграционной политики, направленной на интеграцию групп иностранцев в страну."
 
 ryan_increase_population:0 "Иммиграционная политика повышает численность населения."
 ryan_increase_population_desc:0 "Сфокусироваться на строительстве поселений для интеграции нового населения в экономику."
 
 ryan_increase_manpower:0 "Вербовать иностранных мужчин боевого возраста в обмен на заботу о своих семьях."
 ryan_increase_manpower_desc:0 "Сфокусироваться на строительстве военного жилья и казарм для семей новобранцев."

 ryan_increase_political_power:0 "Усилить политическую власть"
 ryan_increase_political_power_desc:0 "Перевести экономические ресурсы на благосостояние граждан."

 ryan_increase_technology:0 "Увеличить технологические возможности"
 ryan_increase_technology_desc:0 "Преобразование промышленных, военных и военно-морских комплексов в объекты исследований и разработок."

 ryan_state_development_wasteland:0 "Завершить проект по расширению сельскохозяйственных угодий и пастбищ"
 ryan_state_development_wasteland_desc:0 "Возделывать землю для выращивания сельскохозяйственных культур и скота, подходящих для неблагоприятных климатических условий.."
 
 ryan_state_development_rural:0 "Долгосрочное развитие в сельских районах."
 ryan_state_development_rural_desc:0 "Крупные инвестиции в сельских городах сподвигает к урбанизации деревень."

 ryan_state_development_town:0 "Способствовать росту города"
 ryan_state_development_town_desc:0 "Инвестируйте в городские специальности, чтобы они выросли в города."

 ryan_state_development_city:0 "Модернизируйте наши города"
 ryan_state_development_city_desc:0 "Завершить строительство инфраструктуры мирового уровня в наших городах."

 ryan_state_development_largetown:0 "Городские регионы процветают благодаря инвестициям"
 ryan_state_development_largetown_desc:0 "Расширить населенные пункты в плотные городские районы."

 ryan_state_development_largecity:0 "Продолжить расширение города"
 ryan_state_development_largecity_desc:0 "Долгосрочные инвестиции окупятся со временем."

 ryan_state_development_metropolis:0 "Вершина Городских Достижений"
 ryan_state_development_metropolis_desc:0 "Кульминация городских инвестиций привела к тому, что города усеяны небоскребами."

 ryan_state_development_1:0 "Создать новый промышленный район"
 ryan_state_development_1_desc:0 "Национализация земли и строительство инфраструктуры для поддержки нового промышленного района."

 ryan_invest_in_steel:0 "Поддержка сталелитейной промышленности"
 ryan_invest_in_steel_desc:0 "Массовое производство стали требует большей рабочей силы."

 ryan_invest_in_aluminium:0 "Поддержка алюминиевой промышленности"
 ryan_invest_in_aluminium_desc:0 "Огромные заводы расширяются в крупных промышленных зонах."

 ryan_invest_in_chromium:0 "Поддержка хромовой промышленности"
 ryan_invest_in_chromium_desc:0 "В национальных интересах поддерживать разведку и добычу полезных ископаемых.."

 ryan_invest_in_tungsten:0 "Поддержка вольфрамовой промышленности"
 ryan_invest_in_tungsten_desc:0 "В национальных интересах поддерживать разведку и добычу полезных ископаемых.."
 
 ryan_invest_in_coal:0 "Поддержка угольной промышленности"
 ryan_invest_in_coal_desc:0 "Инвестировать в расширение угольных месторождений и инфраструктуры для обеспечения топлива."
 