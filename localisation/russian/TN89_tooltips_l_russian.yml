 ZZZ_new_this_update_MZL_tt: "§CТвичёвская Долбильня\nВерсия 1.0\n\nОкунитесь в мир где стримеры после Великой Твичерской войны так и не решили все свои вопросы. И вновь The Fire Rises!!§! §5(ЧТОО!!! ОТСЫЛКА??!!)§!\n---------------\n§CВозмите на себя роль Мазелова и приведите свою страну к победе!§!"
 ZZZ_new_this_update_STN_tt: "§CТвичёвская Долбильня\nВерсия 1.0\n\nОкунитесь в мир где стримеры после Великой Твичерской войны так и не решили все свои вопросы. И вновь The Fire Rises!!§! §5(ЧТОО!!! ОТСЫЛКА!!??)§!\n---------------\n§CСтинтериус II ещё правит некогда Великой Гондурасией. Кажется у него инсульт! А что дальше? Решай судьбу лидера и страны§!"
 ZZZ_new_this_update_PYA_tt: "§CТвичёвская Долбильня\nВерсия 1.0\n\nОкунитесь в мир где стримеры после Великой Твичерской войны так и не решили все свои вопросы. И вновь The Fire Rises!!§! §5(ЧТОО!!! ОТСЫЛКА!!??)§!\n---------------\n§C42 Братуха! 42! 42! 42!\nЗавези ХАЙПА на Твич! Завези фугаботов! Порадуй твоего босса 42!§!"
 ZZZ_new_this_update_BRT_tt: "§CТвичёвская Долбильня\nВерсия 1.0\n\nОкунитесь в мир где стримеры после Великой Твичерской войны так и не решили все свои вопросы. И вновь The Fire Rises!!§! §5(ЧТОО!!! ОТСЫЛКА!!??)§!\n---------------\n§CНовый шеф восходит на мировую арену! Верните 89 Сквад и диктуйте свои условия. И помните§! §RНИКАКИХ НАРЕЗОК!!§!"
 ZZZ_new_this_update_JGN_tt: "§CThe Twitch Rises\nВерсия 1.1\n\nТвич падает! И только вы сможете спасти его! Спасите платформу от полного краха§!\n---------------\n§CI'm proud to be Hesus!§!"

