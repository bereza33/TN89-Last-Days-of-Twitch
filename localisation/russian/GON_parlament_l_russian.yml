 GON_parlament_category: "Парламент Второй Республики"
 GON_parlament_category_desc: "\n\n\n\n\n£GFX_GON_parlament_decision_category_banner\n\n\n\n\n\n\n\nГондурасия после войны - одна из самых демократических общин на всём твиче, и мы должным каким-то образом удовлетворить все части нашего народа и сохранить наши демократические ценности.\n\nПолитический ландшафт Второй Республики не претерпевал изменений в течение довольно долгого времени, а во время правления Стинтериуса II так вообще реприсирован. Но если мы будем придерживаться нашего курса, и мнение других, то сможем противостоять всему, что нас ожидает.\n\nС нашим парламентом мы можем мирно обсуждать проблемы внутри нашей страны и за ее пределами и общаться как с друзьями, так и с врагами, будем надеяться, что все останется мирным.\n\nОбщая Поддержка Парламента: [?GON_support_parlament_total_var|Y1%][GON_parlament_faction_hoi4_text][GON_parlament_faction_csgo_text][GON_parlament_faction_anime_text][GON_parlament_faction_minecraft_text]"
 #Scripted Loc
