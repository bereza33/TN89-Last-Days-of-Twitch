  ##########################
  # SOCIAL DEVELOPMENT EVENTS
  ##########################

  SocDev.1.t:0 "Снижение уровня бедности"
  SocDev.1.d:0 "Благодаря нашей национальной политике общий уровень бедности в стране существенно снизился. Уменьшилось количество безработных, а уровень жизни низших слоев населения значительно улучшился. Трущобы стали постепенно пустеть, а уровень преступности существенно снизился благодаря этому национальному сдвигу."
  SocDev.1.a:0 "Отлично!"

  SocDev.2.t:0 "Рост бедности"
  SocDev.2.d:0 "По всей стране нищета становится всё более распространенным явлением. В некоторых регионах практически полностью исчезли рабочие места, и многие бродят по улицам в поисках любой работы. Правительству ясно, что наша политика привела к росту бедности по всей стране, резко ухудшив здоровье экономики и снизив уровень жизни. Мы должны сделать всё возможное, чтобы исправить ситуацию."
  SocDev.2.a:0 "О нет."

  SocDev.3.t:0 "Повышение уровня индустриализации"
  SocDev.3.d:0 "Заводы оживают, уголь забрасывается в котлы, и тысячи людей устремляются в города в поисках новой работы. Промышленность значительно расширилась и принесла с собой все блага и проклятия, которые она может дать. По мере модернизации и механизации сельского хозяйства всё большее число людей устремляется в города в поисках работы, привозя с собой инструменты и таланты, необходимые для голодной экономики. Хотя это и скажется на сельскохозяйственной базе, но значительно увеличит промышленный потенциал страны."
  SocDev.3.a:0 "Модернизм - это путь в будущее."

  SocDev.4.t:0 "Снижение темпов индустриализации"
  SocDev.4.d:0 "В городах всё чаще пустуют заводы. В многоквартирных домах, где когда-то кипела жизнь, теперь царит смертельная тишина. Все больше и больше людей ищут стабильности и комфорта в аграрном образе жизни. Экономика страдает от того, что пасторальный образ жизни, которым когда-то жили многие люди, становится все более привычным. Наша промышленность сильно пострадает от этого социального сдвига, но наша сельскохозяйственная база от этого только выиграет."
  SocDev.4.a:0 "Мы должны отказаться от современности."

  SocDev.5.t:0 "Повышение уровня грамотности"
  SocDev.5.d:0 "По всей стране классы заполнены детьми, готовыми к обучению. Наша политика значительно повысила уровень грамотности по всей стране. Программы, реализуемые в бедных районах, помогли многим взрослым в сельской местности перейти от неграмотности к чтению на приемлемом уровне. Повышение уровня грамотности поможет улучшить нашу промышленную и экономическую базу, так как всё большее количество населения сможет принимать более эффективные решения и быстрее обучаться."
  SocDev.5.a:0 "Письменность - краеугольный камень цивилизации"

  SocDev.6.t:0 "Снижение грамотности"
  SocDev.6.d:0 "Пустуют классы, книги лежат на партах, большинство людей по всей стране отказались от необходимости получать высшее образование. В сельской местности даже взрослые люди не способны понять элементарную суть прочитанного, а их дети будут жить не лучше, поскольку книги будут выброшены на свалку для выполнения рутинной работы. Это сильно повлияет на способность страны к индустриализации и приведет к постепенному росту бедности."
  SocDev.6.a:0 "Работа важнее учебы"

  SocDev.7.t:0 "Здоровье экономики улучшается"
  SocDev.7.d:0 "Благодаря экономической политике в настоящее время ВВП нашей страны улучшается. Благодаря этому состояние и стабильность нашей экономики значительно улучшились."
  SocDev.7.a:0 "Чем лучше рынок, тем свободнее люди!"

  SocDev.8.t:0 "Здоровье экономики ухудшаться"
  SocDev.8.d:0 "В результате отказа от экономической политики или просто неверных решений состояние нашей экономики, к сожалению, ухудшилось."
  SocDev.8.a:0 "Видимо, деньги уже не стоят так дорого."

  SocDev.9.t:0 "Рост вестернизации"
  SocDev.9.d:0 "Страна всё дальше продвигается по пути к современной западной цивилизации. Старые племенные и геронтократические обычаи всё чаще заменяются западными культурными традициями. Общины становятся все более зависимыми от современных методов ведения сельского хозяйства, некоторые переезжают в новые промышленные столицы, где смог застилает некогда пустые небеса. Старые идеи уходят на второй план, а новое поколение обращается за будущим к Европе.\n\nНаша страна всё больше превращается в современное, индустриальное и, самое главное, вестернизированное государство."
  SocDev.9.a:0 "Цивилизация, хо!"

  SocDev.10.t:0 "Более современная армия"
  SocDev.10.d:0 "Благодаря нашим военным учениям у нас теперь лучшая армия."
  SocDev.10.a:0 "\"Сэр, да, сэр!\""

