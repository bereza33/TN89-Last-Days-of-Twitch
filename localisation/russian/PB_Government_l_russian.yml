 PB_Sociogenetics_Malthusian_desc:0 "Социальная генетика, обычно сокращенно называемая социогенетикой, - это научная область, связанная с управлением генетическим фондом человека. Социогенетика, появившаяся в конце 1800-х годов, в значительной степени стала ответом на демографический бум, вызванный Вторым Возрождением. По мере развития медицины во всем цивилизованном мире стремительно снижалась детская смертность и, как следствие, росла численность населения. Для борьбы с этим многие страны взяли на вооружение социогенетику, направленную на управление численностью населения и постепенное вытеснение менее желательных признаков.\n\n В большинстве стран это делается с помощью генетических исследований, направленных на выявление таких признаков, как аномально низкий IQ, уродства или врожденные заболевания. При обнаружении таких признаков родителям обычно рекомендуют либо прервать беременность, либо направить ребенка на стерилизацию в соответствующем возрасте. В некоторых странах эта система дополняется лицензированием детей и системой учета населения для предотвращения перенаселения мегаполисов. Хотя на бумаге эти системы не имеют расовой подоплеки, существует бесчисленное множество случаев, когда государство нацеливается на определенные группы населения в непропорционально большей степени, чем на другие.\n\nМальтузианская социогенетика, являющаяся разновидностью социогенетических исследований, в большей степени ориентирована на управление численностью населения, а не на процессы генетического отбора. В связи с демографическим взрывом во многих странах возникла потребность в развитии инфраструктуры и обеспечении жильем. В связи с этим в городах стали проводить политику регулирования численности населения. Политика лицензирования детей и жесткого ограничения размера семьи стала очень распространенной во многих странах. "

