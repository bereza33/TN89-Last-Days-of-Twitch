 SocDev_Menu_Explanation:0 "§YСоциальное развитие§! является грубой метрикой различных факторов в стране.\n\nРешения, принимаемые в ходе кампании, будут §Gположительно§! либо §Rнегативно§! влиять на темпы социального развития. На уровне §Смаксимум§! развитие больше не увеличивается. Максимальный уровень развития может достигать либо 100%, либо -100%. Если уровень развития еще не достиг максимума, то он повышается до следующего уровня развития. Если уровень развития достигнет -100%, то произойдет регресс к предыдущему уровню, если только он не находится на минимально возможном уровне."

