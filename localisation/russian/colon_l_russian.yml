l_russian:

 ### 📂 КАТЕГОРИЯ
 Col_cat: "Колониальный рейд"
 Col_cat_desc: "Чат требует контента. А значит — пора расширяться, захватывать регионы и тащить влияние туда, где его ещё нет."

 ### 🌍 РАНДОМНЫЕ ТЕРРИТОРИИ
 Col_random_state_africa: "Залететь в Африку"
 Col_random_state_africa_desc: "Пока никто не смотрит — можно быстро оформить контроль над случайным прибрежным регионом Африки. Чат одобряет."

 Col_random_state_oceania: "Рейд в Океанию"
 Col_random_state_oceania_desc: "Острова, море и слабый контроль — идеальные условия, чтобы отжать кусок Океании и назвать это контентом."

 ### 🧭 СОСЕДНИЕ РЕГИОНЫ
 Col_neighbour_state_africa: "Поджать Африку"
 Col_neighbour_state_africa_desc: "Соседние регионы Африки выглядят слишком свободными. Пора это исправить и немного расширить карту нашего влияния."

 Col_neighbour_state_oceania: "Забрать острова"
 Col_neighbour_state_oceania_desc: "Острова Океании буквально просятся под наш контроль. Чат уже готов ставить ставки."

 ### ⚔️ ПОГРАНИЧНАЯ ВОЙНА
 Col_neighbour_state_war: "Залететь на конфликт"
 Col_neighbour_state_war_desc: "Можно попробовать силой забрать спорный регион. Если повезёт — победа. Если нет… ну, будет клип."

 ### 📢 ИВЕНТЫ

 col.1.t: "Регион оформлен"
 col.1.d: "Чат ликует — территория успешно забрана. Ещё один регион теперь под нашим контролем."
 col.1.a: "Заслужили"

 col.2.t: "Началось недовольство"
 col.2.d: "Бывший владелец и местные начали ныть. Ситуация накаляется — можно пойти до конца или сделать вид, что ничего не было."
 col.2.a: "Дожимаем"
 col.2.b: "Ладно, откатываем"

 col.3.t: "Не зашло"
 col.3.d: "Попытка конфликта сорвалась. Ни войны, ни региона — просто пустой слот."
 col.3.a: "Бывает"

 col.4.t: "GG WP"
 col.4.d: "Конфликт выигран. Регион наш, влияние растёт, чат доволен."
 col.4.a: "Едем дальше"

 col.5.t: "Фейл"
 col.5.d: "Мы проиграли конфликт. Минус влияние, минус настроение. Чат недоволен."
 col.5.a: "Переживём"
